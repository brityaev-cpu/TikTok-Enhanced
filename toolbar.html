<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Enhanced 0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#101015;color:#f6f6f7;font:12px system-ui,Segoe UI,sans-serif;overflow:hidden}.bar{height:60px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #303038}.logo{font-size:14px;font-weight:800;white-space:nowrap}.logo b{color:#ff335f}.group{display:flex;gap:4px;align-items:center}button,select{cursor:pointer;border:1px solid #363640;background:#22222b;color:#f5f5f5;border-radius:8px;padding:7px 9px;font:inherit}button:hover{background:#363640}button.active{border-color:#ff335f;color:#ff8ba6}.spacer{flex:1}label{display:flex;align-items:center;gap:4px;color:#bbb}input[type=range]{width:70px;accent-color:#ff335f}.toast{color:#ff8ba6;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:1100px){.logo,.toast{display:none}}@media(max-width:850px){.compact{display:none}.bar{padding:0 5px;gap:4px}button{padding:7px}}</style></head><body><div class="bar"><div class="logo"><b>♪</b> TikTok Enhanced 0.3</div><div class="group"><button data-cmd="back" title="Назад">←</button><button data-cmd="home" title="Лента">⌂</button><button data-cmd="reload" title="Обновить">↻</button></div><div class="group"><button data-cmd="prev" title="Предыдущее">↑</button><button data-cmd="next" title="Следующее">↓</button><button data-cmd="pause" title="Пауза">⏯</button><button data-cmd="mute" title="Без звука">♪</button></div><div class="group compact"><label>Громкость <input id="volume" type="range" min="0" max="100" value="80"></label><label>Скорость <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><div class="spacer"></div><span id="toast" class="toast"></span><div class="group"><button data-cmd="autoNext" title="Следующее после окончания">Авто</button><button data-cmd="download" title="Скачать доступное видео">↓ MP4</button><button data-cmd="copy" title="Копировать ссылку">🔗</button><button data-cmd="focus">Фокус</button><button data-cmd="mini" class="compact">Мини</button><button data-cmd="top" class="compact" title="Поверх всех">📌</button><button data-cmd="fullscreen" title="Полный экран">⛶</button><button data-cmd="external" title="Открыть в браузере">↗</button></div></div><script src="toolbar.js"></script></body></html>
